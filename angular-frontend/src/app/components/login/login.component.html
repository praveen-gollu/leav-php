<div class="bg-dark min-vh-100 d-flex align-items-center">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-4">
        <div class="card card-login mx-auto">
          <div class="card-header">
            <h4 class="text-center mb-0">Login</h4>
          </div>
          <div class="card-body">
            <div *ngIf="error" class="alert alert-danger" role="alert">
              {{ error }}
            </div>
            
            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
              <div class="form-group mb-3">
                <label for="user_email">Email address</label>
                <input 
                  type="email" 
                  class="form-control" 
                  id="user_email"
                  formControlName="user_email"
                  placeholder="Enter email"
                  [class.is-invalid]="loginForm.get('user_email')?.invalid && loginForm.get('user_email')?.touched">
                <div *ngIf="loginForm.get('user_email')?.invalid && loginForm.get('user_email')?.touched" class="invalid-feedback">
                  Please enter a valid email address.
                </div>
              </div>
              
              <div class="form-group mb-3">
                <label for="user_pass">Password</label>
                <input 
                  type="password" 
                  class="form-control" 
                  id="user_pass"
                  formControlName="user_pass"
                  placeholder="Password"
                  [class.is-invalid]="loginForm.get('user_pass')?.invalid && loginForm.get('user_pass')?.touched">
                <div *ngIf="loginForm.get('user_pass')?.invalid && loginForm.get('user_pass')?.touched" class="invalid-feedback">
                  Password is required.
                </div>
              </div>
              
              <button 
                type="submit" 
                class="btn btn-primary btn-block w-100"
                [disabled]="loading || loginForm.invalid">
                <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
                {{ loading ? 'Logging in...' : 'Login' }}
              </button>
              
              <div class="text-center mt-3">
                <a href="#" class="btn btn-warning btn-block w-100">Reset Password</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
